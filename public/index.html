<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Piano Learning</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🎹 Piano Learning</h1>

    <div class="midi-panel">
      <span id="midi-status" class="midi-status midi-status--disconnected">Piano not connected</span>
      <div class="midi-connect">
        <select id="midi-device-select" aria-label="MIDI input device"></select>
        <button id="midi-connect-btn" type="button">Connect</button>
        <button id="midi-refresh-btn" type="button" title="Rescan MIDI devices">⟳</button>
      </div>
    </div>
  </header>

  <nav class="app-nav" id="app-nav">
    <button data-view="home" class="nav-btn is-active">Home</button>
    <button data-view="trainer" class="nav-btn">Note Trainer</button>
    <button data-view="sheet" class="nav-btn">Sheet Practice</button>
    <button data-view="songs" class="nav-btn">Songs</button>
    <button data-view="stats" class="nav-btn">Stats</button>
  </nav>

  <main id="view-root" class="view-root">
    <p class="loading">Loading&hellip;</p>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
